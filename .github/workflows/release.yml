name: Release

# Build a DMG and attach it to a GitHub Release whenever a version tag is pushed.
#   git tag v1.0 && git push origin v1.0
# Also runnable on demand from the Actions tab (uploads the DMG as a build artifact).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app + DMG
        run: |
          chmod +x build-app.sh make-dmg.sh
          ./make-dmg.sh

      - name: Upload DMG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thunderbox-dmg
          path: build/Thunderbox.dmg

      - name: Attach DMG to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Thunderbox.dmg
          generate_release_notes: true
